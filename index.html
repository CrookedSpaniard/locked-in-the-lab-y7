<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Locked in the Lab · Year 7</title>
  <meta name="description" content="An escape room for Year 7: open 7 locks about passwords, lab safety, respectful emails, kind comments, feedback, cyberbullying and great presentations to escape the computing lab.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <button class="brand" id="btnHome" title="Back to the start page">
        <span class="logo-box"><img src="logo.png" alt="British School Alzira · Xàtiva · Gandia" width="267" height="405"></span>
        <span><small>Year 7 · Computing</small><b>Locked in the Lab</b></span>
      </button>
      <div class="strip" id="strip" aria-label="Your letters"></div>
      <div class="top-btns">
        <span class="timer" id="points" hidden>🏆 <b>0</b></span>
        <span class="timer" id="timer" hidden>⏱ <b>00:00</b></span>
        <button class="chip" id="btnHelp">❓ Help</button>
        <button class="chip" id="btnSave" hidden>💾 Save</button>
        <button class="chip" id="btnReset" hidden title="Delete everything and start again">↺ New team</button>
        <button class="chip" id="btnProg">📊 Our answers</button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-x" id="modalX" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/extra.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
